<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Quote Collector</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<header>
			<h1>📖 Quote Collector</h1>
			<div class="export-wrap">
				<button id="export-btn" title="Export your library">Export ▾</button>
				<div id="export-menu" class="export-menu" hidden>
					<button type="button" data-format="json">as JSON</button>
					<button type="button" data-format="txt">as TXT</button>
					<button type="button" data-format="docx">as DOCX</button>
				</div>
			</div>
		</header>

		<div class="search-wrap">
			<input
				id="search-input"
				type="search"
				placeholder="Search text, notes, tags…"
			/>
			<button
				id="search-clear"
				class="search-clear-btn"
				type="button"
				aria-label="Clear search"
				title="Clear"
			>
				×
			</button>
		</div>

		<div id="tag-cloud"></div>

		<div id="quotes-list"></div>

		<script src="export.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
