name: Package browser releases

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package separate browser builds
        run: ./scripts/package-releases.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/quote-collector-chromium.zip
          dist/quote-collector-firefox.zip
          --generate-notes
          --title "Quote Collector $GITHUB_REF_NAME"
